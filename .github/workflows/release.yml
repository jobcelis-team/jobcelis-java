# Publishes automatically on every push to main that changes the package:
#   1. next-version (jobcelis-team/.github) picks the version: the last release
#      plus a patch, or the version in pom.xml when it was raised by hand.
#      Docs, tests, CI and repo config release nothing.
#   2. writes it into pom.xml and commits it locally
#   3. signs it and publishes it to Maven Central
#   4. pushes the version commit and tags vX.Y.Z
# To release a minor or major version, raise it in pom.xml.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Read version
        id: current
        run: |
          VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Next version
        id: v
        uses: jobcelis-team/.github/actions/next-version@main
        with:
          current: ${{ steps.current.outputs.version }}
          tag-prefix: "v"

      - name: Write the version
        if: steps.v.outputs.release == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mvn -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Commit the version
        if: steps.v.outputs.release == 'true'
        uses: jobcelis-team/.github/actions/commit-version@main
        with:
          version: ${{ steps.v.outputs.version }}

      - name: Already released?
        id: check
        if: steps.v.outputs.release == 'true'
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          MISSING=""
          [ -n "$MAVEN_USERNAME" ] || MISSING="$MISSING MAVEN_USERNAME"
          [ -n "$MAVEN_PASSWORD" ] || MISSING="$MISSING MAVEN_PASSWORD"
          [ -n "$GPG_PRIVATE_KEY" ] || MISSING="$MISSING GPG_PRIVATE_KEY"
          [ -n "$GPG_PASSPHRASE" ] || MISSING="$MISSING GPG_PASSPHRASE"
          if [ -n "$MISSING" ]; then
            echo "::warning::Not publishing: add the repository secret(s)$MISSING, then run this workflow again (Actions > Release > Run workflow)."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://repo1.maven.org/maven2/com/jobcelis/jobcelis/${{ steps.v.outputs.version }}/jobcelis-${{ steps.v.outputs.version }}.pom")
          if [ "$CODE" = "200" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "${{ steps.v.outputs.version }} is already published: nothing to do"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Maven Central
        if: steps.check.outputs.release == 'true'
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B deploy -P release

      - name: Push the version and tag the release
        if: steps.v.outputs.release == 'true' && (steps.check.outputs.release == 'true' || steps.check.outputs.published == 'true')
        uses: jobcelis-team/.github/actions/push-release@main
        with:
          tag: ${{ steps.v.outputs.tag }}
